<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kim Hoàng Sang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Ảnh nền hoa anh đào Tokyo Skytree */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('cover.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas hiệu ứng chuột tương tác */
        #cursorCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* Hiệu ứng cánh hoa anh đào (Sakura) rơi */
        .sakura {
            position: fixed;
            top: -10px;
            color: #ffb7c5;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.9;
            text-shadow: 0 0 5px rgba(255, 183, 197, 0.8);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(25px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-25px);
                opacity: 0.2;
            }
        }

        /* Card cá nhân kính mờ (Glassmorphism) */
        .card {
            background-color: rgba(13, 17, 23, 0.75);
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Viền phát sáng cầu vồng RGB xoay quanh Avatar */
        .avatar-container {
            position: relative;
            width: 135px;
            height: 135px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbGlow 12s linear infinite;
            box-shadow: 0 0 20px rgba(255, 0, 200, 0.4);
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.8;
            animation: rgbGlow 12s linear infinite;
            z-index: -1;
        }

        @keyframes rgbGlow {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #161b22;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        /* Styling cho phần gõ chữ Slogan */
        .tagline {
            font-size: 0.95rem;
            color: #ffb7c5;
            margin-bottom: 18px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Con trỏ nhấp nháy khi gõ */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #ffb7c5;
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #c9d1d9;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
            background-color: rgba(33, 38, 45, 0.8);
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-facebook:hover {
            background-color: #1877f2;
            color: white;
            border-color: #1877f2;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
        }

        .btn-tiktok:hover {
            background-color: #000000;
            color: white;
            border-color: #fe2c55;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
        }

        /* Khung Mã QR */
        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 183, 197, 0.2);
        }

        .qr-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .qr-image {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 6px;
            background-color: #161b22;
            transition: transform 0.3s ease;
        }

        .qr-image:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Canvas cho hiệu ứng chuột tương tác -->
    <canvas id="cursorCanvas"></canvas>

    <div class="card">
        <!-- Avatar với viền phát sáng Cầu vồng RGB -->
        <div class="avatar-container">
            <img src="sang.png" alt="Kim Hoàng Sang" class="avatar">
        </div>
        
        <h1 class="name">Kim Hoàng Sang</h1>
        
        <!-- Khung hiển thị hiệu ứng gõ chữ -->
        <p class="tagline"><span id="typedText"></span><span class="typing-cursor"></span></p>
        
        <p class="bio">
            Chào bạn! Mình là Kim Hoàng Sang. Rất vui được kết nối cùng bạn! Cùng ghé thăm trang cá nhân và theo dõi mình nhé!
        </p>

        <div class="links">
            <a href="https://www.facebook.com/h24302?locale=vi_VN" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@hsang.ahihi" target="_blank" class="btn btn-tiktok">
                <i class="fab fa-tiktok"></i> TikTok (@hsang.ahihi)
            </a>
        </div>

        <!-- Khung Mã QR -->
        <div class="qr-section">
            <p class="qr-title">Quét mã QR để chia sẻ trang cá nhân:</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://kimsang29033-git.github.io/my-proflie/&color=ffffff&bgcolor=161b22" alt="Mã QR Profile" class="qr-image">
        </div>
    </div>

    <!-- Script hiệu ứng hoa anh đào, Hạt theo chuột & Gõ chữ -->
    <script>
        // 1. Hiệu ứng cánh hoa anh đào rơi
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            
            const petals = ['🌸', '💮', '🌸', '🌸'];
            sakura.innerText = petals[Math.floor(Math.random() * petals.length)];
            
            sakura.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 10 + 12;
            sakura.style.fontSize = size + 'px';
            
            const duration = Math.random() * 4 + 4;
            sakura.style.animationDuration = duration + 's';
            
            document.body.appendChild(sakura);
            
            setTimeout(() => {
                sakura.remove();
            }, duration * 1000);
        }

        setInterval(createSakura, 250);

        // 2. Hiệu ứng hạt ánh sáng chạy theo con trỏ chuột
        const canvas = document.getElementById('cursorCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        let mouse = { x: null, y: null };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(mouse.x, mouse.y));
            }
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                this.color = `hsl(${Math.random() * 60 + 320}, 100%, 75%)`;
                this.life = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        function handleParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);

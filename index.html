<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kim Hoàng Sang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng tuyết rơi */
        .snowflake {
            position: fixed;
            top: -10px;
            color: #fff;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Card cá nhân */
        .card {
            background-color: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fe2c55;
            padding: 3px;
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.4);
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #8b949e;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-facebook:hover {
            background-color: #1877f2;
            color: white;
            border-color: #1877f2;
        }

        .btn-tiktok:hover {
            background-color: #000000;
            color: white;
            border-color: #fe2c55;
        }

        /* Nút phát nhạc */
        .music-player {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
        }

        .music-btn {
            background: linear-gradient(45deg, #fe2c55, #ff007f);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
        }

        .music-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(254, 44, 85, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img src="sang.png" alt="Kim Hoàng Sang" class="avatar">
        </div>
        
        <h1 class="name">Kim Hoàng Sang</h1>
        <p class="tagline">✨ Kết nối - Cảm hứng - Yêu đời ✨</p>
        
        <p class="bio">
            Chào bạn! Mình là Kim Hoàng Sang. Rất vui được kết nối cùng bạn! Cùng ghé thăm trang cá nhân và theo dõi mình nhé!
        </p>

        <div class="links">
            <a href="https://www.facebook.com/h24302?locale=vi_VN" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@hsang.ahihi" target="_blank" class="btn btn-tiktok">
                <i class="fab fa-tiktok"></i> TikTok (@hsang.ahihi)
            </a>
        </div>

        <!-- Trình phát nhạc -->
        <div class="music-player">
            <button id="playBtn" class="music-btn">
                <i class="fas fa-music"></i> <span id="musicText">Bật Nhạc: Vì Anh Đâu Có Biết</span>
            </button>
            <audio id="bgMusic" loop src="https://files.catbox.moe/8s0z9i.mp3"></audio>
        </div>
    </div>

    <!-- Script tạo tuyết rơi & Điều khiển nhạc -->
    <script>
        // Hiệu ứng Tuyết Rơi
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            const icons = ['❄', '❅', '❆', '•'];
            snowflake.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            snowflake.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 12 + 10;
            snowflake.style.fontSize = size + 'px';
            
            const duration = Math.random() * 5 + 3;
            snowflake.style.animationDuration = duration + 's';
            
            document.body.appendChild(snowflake);
            
            setTimeout(() => {
                snowflake.remove();
            }, duration * 1000);
        }

        setInterval(createSnowflake, 200);

        // Điều khiển nhạc
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const musicText = document.getElementById('musicText');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                musicText.innerText = "Tắt Nhạc";
                playBtn.style.background = "#30363d";
            } else {
                audio.pause();
                musicText.innerText = "Bật Nhạc: Vì Anh Đâu Có Biết";
                playBtn.style.background = "linear-gradient(45deg, #fe2c55, #ff007f)";
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kim Hoàng Sang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Ảnh nền hoa anh đào Tokyo Skytree */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('cover.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng cánh hoa anh đào (Sakura) rơi */
        .sakura {
            position: fixed;
            top: -10px;
            color: #ffb7c5;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.9;
            text-shadow: 0 0 5px rgba(255, 183, 197, 0.8);
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 0.9;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(25px);
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-25px);
                opacity: 0.2;
            }
        }

        /* Card cá nhân kính mờ (Glassmorphism) */
        .card {
            background-color: rgba(13, 17, 23, 0.75);
            border: 1px solid rgba(255, 183, 197, 0.3);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Viền phát sáng cầu vồng RGB xoay quanh Avatar */
        .avatar-container {
            position: relative;
            width: 135px;
            height: 135px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbGlow 12s linear infinite;
            box-shadow: 0 0 20px rgba(255, 0, 200, 0.4);
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.8;
            animation: rgbGlow 12s linear infinite;
            z-index: -1;
        }

        @keyframes rgbGlow {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #161b22;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.9rem;
            color: #ffb7c5;
            margin-bottom: 18px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #c9d1d9;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
            background-color: rgba(33, 38, 45, 0.8);
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-facebook:hover {
            background-color: #1877f2;
            color: white;
            border-color: #1877f2;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
        }

        .btn-tiktok:hover {
            background-color: #000000;
            color: white;
            border-color: #fe2c55;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
        }

        /* Khung Mã QR */
        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 183, 197, 0.2);
        }

        .qr-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .qr-image {
            width: 140px;
            height: 140px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 6px;
            background-color: #161b22;
            transition: transform 0.3s ease;
        }

        .qr-image:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Avatar với viền phát sáng Cầu vồng RGB -->
        <div class="avatar-container">
            <img src="sang.png" alt="Kim Hoàng Sang" class="avatar">
        </div>
        
        <h1 class="name">Kim Hoàng Sang</h1>
        <p class="tagline">🌸 Kết nối - Cảm hứng - Yêu đời 🌸</p>
        
        <p class="bio">
            Chào bạn! Mình là Kim Hoàng Sang. Rất vui được kết nối cùng bạn! Cùng ghé thăm trang cá nhân và theo dõi mình nhé!
        </p>

        <div class="links">
            <a href="https://www.facebook.com/h24302?locale=vi_VN" target="_blank" class="btn btn-facebook">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@hsang.ahihi" target="_blank" class="btn btn-tiktok">
                <i class="fab fa-tiktok"></i> TikTok (@hsang.ahihi)
            </a>
        </div>

        <!-- Khung Mã QR -->
        <div class="qr-section">
            <p class="qr-title">Quét mã QR để chia sẻ trang cá nhân:</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://kimsang29033-git.github.io/my-proflie/&color=ffffff&bgcolor=161b22" alt="Mã QR Profile" class="qr-image">
        </div>
    </div>

    <!-- Script tạo hiệu ứng cánh hoa anh đào rơi -->
    <script>
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            
            // Các dạng biểu tượng hoa anh đào
            const petals = ['🌸', '💮', '🌸', '🌸'];
            sakura.innerText = petals[Math.floor(Math.random() * petals.length)];
            
            sakura.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 10 + 12; // Kích thước 12px - 22px
            sakura.style.fontSize = size + 'px';
            
            const duration = Math.random() * 4 + 4; // Tốc độ rơi 4s - 8s
            sakura.style.animationDuration = duration + 's';
            
            document.body.appendChild(sakura);
            
            setTimeout(() => {
                sakura.remove();
            }, duration * 1000);
        }

        // Tạo cánh hoa liên tục mỗi 250ms
        setInterval(createSakura, 250);
    </script>

</body>
</html>

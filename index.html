<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kim Hoàng Sang</title>
    <!-- Font chữ và Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d0f18;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 550px 550px;
            background-position: 0 0, 40px 60px;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff477e;
            padding: 3px;
            background: #111;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .tagline {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 14px;
            color: #cbd5e0;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .link-btn i {
            font-size: 20px;
        }
        
        .btn-fb i { color: #1877f2; }
        .btn-tt i { color: #ffffff; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
        </div>

        <h1 class="name">Kim Hoàng Sang</h1>
        <div class="tagline">✨ Kết nối - Cảm hứng - Yêu đời ✨</div>

        <p class="bio">
            Chào bạn! Mình là Kim Hoàng Sang. Rất vui được kết nối cùng bạn! Cùng ghé thăm trang cá nhân và theo dõi mình nhé!
        </p>

        <div class="links-container">
            <a href="https://www.facebook.com/h24302?locale=vi_VN" target="_blank" class="link-btn btn-fb">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>
            
            <a href="https://www.tiktok.com/@hsang.ahihi" target="_blank" class="link-btn btn-tt">
                <i class="fa-brands fa-tiktok"></i> TikTok (@hsang.ahihi)
            </a>
        </div>
    </div>

</body>
</html>

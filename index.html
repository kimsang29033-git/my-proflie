<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Kim Hoàng Sang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('cover.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        #cursorCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .sakura {
            position: fixed;
            top: -10px;
            color: #ffb7c5;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.9;
            text-shadow: 0 0 5px rgba(255, 183, 197, 0.8);
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.9; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(25px); }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-25px); opacity: 0.2; }
        }

        .card {
            background-color: rgba(13, 17, 23, 0.88);
            border: 1px solid rgba(255, 183, 197, 0.35);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(12px);
            margin: auto;
        }

        .avatar-wrapper {
            position: relative;
            width: 136px;
            height: 136px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .avatar-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rgbGlow 8s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 0, 200, 0.6));
        }

        @keyframes rgbGlow {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .avatar {
            position: relative;
            width: 124px;
            height: 124px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #161b22;
            background-color: #21262d;
            z-index: 1;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(33, 38, 45, 0.9);
            border: 1px solid #30363d;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #8b949e;
            border-radius: 50%;
        }

        .online .status-dot {
            background-color: #238636;
            box-shadow: 0 0 8px #238636;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(35, 134, 54, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); }
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.95rem;
            color: #ffb7c5;
            margin-bottom: 15px;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #ffb7c5;
            margin-left: 3px;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #c9d1d9;
            margin-bottom: 20px;
        }

        .skills-section {
            margin-bottom: 20px;
        }

        .skills-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .skill-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(33, 38, 45, 0.9);
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #c9d1d9;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .skill-badge:hover {
            transform: translateY(-3px);
            border-color: #ffb7c5;
            box-shadow: 0 4px 12px rgba(255, 183, 197, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #161b22;
            border: 1px solid rgba(255, 183, 197, 0.4);
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            text-align: left;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ffb7c5;
        }

        .modal-title {
            font-size: 1.2rem;
            color: #f0f6fc;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-body {
            font-size: 0.9rem;
            color: #c9d1d9;
            line-height: 1.6;
        }

        .modal-body ul {
            padding-left: 20px;
            margin-top: 8px;
        }

        .modal-body li {
            margin-bottom: 6px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
            background-color: rgba(33, 38, 45, 0.85);
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-facebook:hover {
            background-color: #1877f2;
            color: white;
            border-color: #1877f2;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
        }

        .btn-tiktok:hover {
            background-color: #000000;
            color: white;
            border-color: #fe2c55;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
        }

        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 183, 197, 0.2);
        }

        .qr-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 12px;
        }

        .qr-image {
            width: 130px;
            height: 130px;
            border-radius: 12px;
            border: 1px solid #30363d;
            padding: 6px;
            background-color: #ffffff;
            transition: transform 0.3s ease;
        }

        .qr-image:hover {
            transform: scale(1.05);
        }

        .visitor-counter {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 183, 197, 0.2);
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .visitor-counter img {
            vertical-align: middle;
            border-radius: 4px;
        }
    </style>
</head>
